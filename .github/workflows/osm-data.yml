# Downloads OpenStreetMap coastline and place names for the route calculator
# and publishes them on the `osm-data` branch. Run manually (or when a fetch
# script changes); data-scripts/build_coast.py then turns them into coast.js,
# and data-scripts/build_outer.py turns outer.json into coast-outer.js.
name: OSM data

on:
  workflow_dispatch:
  push:
    paths:
      - data-scripts/fetch_osm.sh
      - data-scripts/fetch_outer.sh
      - .github/workflows/osm-data.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download from Overpass
        run: data-scripts/fetch_osm.sh out
      - name: Download Newcastle → Scarborough coast and estuaries
        run: bash data-scripts/fetch_outer.sh out
      - name: Publish to osm-data branch
        run: |
          cd out
          git init -q -b osm-data
          git config user.name "osm-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add features.json names.json seamarks.json water.json outer.json
          git commit -q -m "OSM data $(date -u +%FT%TZ) — © OpenStreetMap contributors, ODbL"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" osm-data
